name: Build Windows desktop app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        shell: bash
        run: |
          cp index.html desktop/
          cd desktop
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version; fi
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Procedure-windows
          path: desktop/dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          body: |
            **Procedure-…-setup.exe** installs Procédure. **Procedure-…-portable.exe** runs without installing.
            The web version is at https://kefirman9000.github.io/procedure/
            If Procédure helps you, please consider [sponsoring on GitHub](https://github.com/sponsors/kefirman9000) ♥
