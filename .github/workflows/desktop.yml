name: Build Windows desktop app
on:
  push:
    branches: [main]
    paths: ["version.json"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the local-AI setup script
        shell: pwsh
        run: |
          $t = Get-Content setup/Setup-Local-AI.cmd -Raw
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseInput($t, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host "Setup script parses OK"
      - name: Build
        id: build
        shell: bash
        run: |
          v=$(node -p "require('./version.json').version")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          cp index.html desktop/
          cd desktop
          npm version "$v" --no-git-tag-version --allow-same-version
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Procedure-windows
          path: desktop/dist/*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.v }}
          name: Procédure ${{ steps.build.outputs.v }}
          files: desktop/dist/*.exe
          body: |
            **Procedure-${{ steps.build.outputs.v }}-setup.exe** installs Procédure. **Procedure-${{ steps.build.outputs.v }}-portable.exe** runs without installing.
            Web version: https://kefirman9000.github.io/Procedure/
            If Procédure helps you, please consider [sponsoring on GitHub](https://github.com/sponsors/kefirman9000) ♥
